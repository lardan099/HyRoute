# Tests on every push: the Go packages on Windows (where HyRoute runs) and
# Linux, known vulnerabilities, and the UI (type check and that the
# committed frontend/dist is built from the sources). Actions are pinned
# by commit SHA; the tag is in the comment.
name: ci
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Newest patch of the release branch: security fixes land there.
          go-version: '1.27.x'
          check-latest: true
      - run: go vet ./...
      - run: go test ./... && go test -v -run 'WFP|ExistingFlows|ArmUnderGC|Task' ./internal/killswitch/ ./internal/autostart/
        env:
          # The runner is elevated: test the kill switch with real WFP filters.
          HYROUTE_WFP_TEST: '1'
      - name: hyroutectl smoke test (no HyRoute on the runner exits 3)
        shell: pwsh
        run: |
          go build -o $env:RUNNER_TEMP\hyroutectl.exe ./cmd/hyroutectl
          & $env:RUNNER_TEMP\hyroutectl.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $env:RUNNER_TEMP\hyroutectl.exe status
          if ($LASTEXITCODE -ne 3) { exit 1 }
          exit 0
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: go test -race ./...
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: UI type check and build
        working-directory: frontend
        run: |
          npm ci
          npx svelte-check --threshold warning
          npm run build
      - name: frontend/dist matches the sources
        run: |
          git status --porcelain frontend/dist
          test -z "$(git status --porcelain frontend/dist)" || { echo "::error::frontend/dist is stale: run npm run build in frontend and commit it"; exit 1; }
