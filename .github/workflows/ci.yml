# Tests on every push: the Go packages on Windows (where HyRoute runs) and
# Linux, known vulnerabilities, and the UI (type check and that the
# committed frontend/dist is built from the sources). Actions are pinned
# by commit SHA; the tag is in the comment.
name: ci
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Newest patch of the release branch: security fixes land there.
          go-version: '1.27.x'
          check-latest: true
      - run: go vet ./...
      - run: go test ./... && go test -v -run 'WFP|ExistingFlows|ArmUnderGC|Task' ./internal/killswitch/ ./internal/autostart/
        env:
          # The runner is elevated: test the kill switch with real WFP filters.
          HYROUTE_WFP_TEST: '1'
      - name: hyroutectl smoke test (no HyRoute on the runner exits 3)
        shell: pwsh
        run: |
          go build -o $env:RUNNER_TEMP\hyroutectl.exe ./cmd/hyroutectl
          & $env:RUNNER_TEMP\hyroutectl.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $env:RUNNER_TEMP\hyroutectl.exe status
          if ($LASTEXITCODE -ne 3) { exit 1 }
          exit 0
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: gofmt
        # On Linux: a Windows checkout may turn the line ends into CRLF.
        run: |
          files=$(gofmt -l cmd internal build tools frontend/*.go web/admin/*.go)
          test -z "$files" || { echo "$files"; echo "::error::gofmt -l lists these files: run gofmt -w on them"; exit 1; }
      # The Linux build (hyroute-server) has code of its own: vet and the
      # vulnerability check also for GOOS=linux.
      - run: go vet ./...
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: WinDivert's filter compiler (tools/wdfilter)
        run: ./tools/wdfilter/build.sh
      - run: go test -race ./...
        env:
          # The filter tests run through WinDivert's own compiler: a main
          # filter over 256 tests makes «Подключить» fail.
          HYROUTE_WDFILTER: ${{ github.workspace }}/tools/wdfilter/wdfilter
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: UI type check and build
        working-directory: frontend
        run: |
          npm ci
          npx svelte-check --threshold warning
          npm run build
      - name: UI Privacy mode masks as logx.Sanitize
        working-directory: frontend
        run: node --experimental-strip-types scripts/privacy-check.mjs
      - name: frontend/dist matches the sources
        run: |
          git status --porcelain frontend/dist
          test -z "$(git status --porcelain frontend/dist)" || { echo "::error::frontend/dist is stale: run npm run build in frontend and commit it"; exit 1; }
      - name: Server manager admin type check and build
        working-directory: web/admin
        run: |
          npm ci
          npx svelte-check --threshold warning
          npm run build
      - name: web/admin/dist matches the sources
        run: |
          git status --porcelain web/admin/dist
          test -z "$(git status --porcelain web/admin/dist)" || { echo "::error::web/admin/dist is stale: run npm run build in web/admin and commit it"; exit 1; }
