# Builds and publishes a release when a v* tag is pushed. The release body
# is the annotated tag message (shown as the changelog in HyRoute's update
# dialog). Tags with a "-" (v0.6.0-beta.1) become prereleases.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
# One run per tag at a time: a tag pushed twice must not race itself.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      # build.ps1 and package.ps1 use this tag, not whichever git describe
      # picks when the commit has several.
      HYROUTE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - run: git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
        shell: bash
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Newest patch of the release branch: security fixes land there.
          go-version: '1.27.x'
          check-latest: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build
        # -Frontend: the UI in the release is built from the sources here,
        # not taken from the committed frontend/dist.
        run: .\scripts\build.ps1 -Frontend
      - name: Test
        run: go test ./...
      - name: Package
        run: .\scripts\package.ps1
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          # A published release is never replaced: installed copies may
          # already be downloading it and check it against SHA256SUMS.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists, nothing to publish"
            exit 0
          fi
          # Notes: docs/release-notes/<tag>.txt; otherwise the message of
          # an annotated tag. A lightweight tag has none (its contents
          # would be the commit message), so it gets a plain line.
          if [ -f "docs/release-notes/$tag.txt" ]; then
            cp "docs/release-notes/$tag.txt" notes.md
          elif [ "$(git cat-file -t "$tag")" = tag ]; then
            git tag -l --format='%(contents)' "$tag" > notes.md
          else
            echo "HyRoute $tag" > notes.md
          fi
          pre=""
          case "$tag" in *-*) pre="--prerelease";; esac
          gh release create "$tag" "dist/HyRoute-${tag#v}-windows-amd64.zip" dist/SHA256SUMS --title "HyRoute $tag" --notes-file notes.md $pre
